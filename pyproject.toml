[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "arbogast"
version = "0.2.0"
description = "Certificate-first exact arithmetic, cohomology, symmetry, and Hurwitz computation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "azide0x37" }]
keywords = [
  "computational-mathematics",
  "cohomology",
  "finite-groups",
  "hurwitz-spaces",
  "number-theory",
  "selmer-groups",
  "certificates",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.3",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "ruff>=0.13",
]

[project.scripts]
arbogast = "arbogast.cli:main"
arb = "arbogast.cli:main"

[project.urls]
Homepage = "https://github.com/azide0x37/arbogast"
Repository = "https://github.com/azide0x37/arbogast"
Issues = "https://github.com/azide0x37/arbogast/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arbogast"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/arbogast"]
