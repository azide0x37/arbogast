name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Build wheel and source distribution
        run: uv build

      - name: Check release surface
        run: uv run python scripts/check_release.py

      - name: Smoke CLI contracts
        run: |
          uv run arbogast version --json
          uv run arbogast describe cohom.h1 --json
          uv run arbogast route --from NielsenClass --to ClaimGraph --json

      - name: Run exact cohomology example
        run: uv run python examples/group_cohomology/cyclic_action_h1.py

      - name: Run local research campaign example
        run: >-
          uv run python examples/campaigns/antieau_klueners_malle/run.py
          --output "${RUNNER_TEMP}/arbogast-campaign"

      - name: Run separated discovery and verification example
        run: |
          uv run python examples/certificates/prove_without_search/discover.py --output "${RUNNER_TEMP}/arbogast-certificate.json"
          uv run python examples/certificates/prove_without_search/verify.py "${RUNNER_TEMP}/arbogast-certificate.json"

      - name: Run exact M23 certificate example
        run: |
          uv run python examples/hurwitz/m23_real_component/compute.py --output "${RUNNER_TEMP}/m23-claims.json"
          uv run python examples/hurwitz/m23_real_component/verify.py "${RUNNER_TEMP}/m23-claims.json"
